name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test all targets
        run: cargo test --locked

  packages:
    name: package contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Verify npm metadata and aliases
        run: npm test
      - name: Verify npm archive
        run: npm pack --dry-run
      - name: Install and execute npm archive
        run: |
          package="$(npm pack --silent)"
          npm install --global --prefix "$RUNNER_TEMP/hc" "./$package"
          "$RUNNER_TEMP/hc/bin/hc" --help
          "$RUNNER_TEMP/hc/bin/brainmesh" --version
      - name: Verify Cargo archive
        run: cargo package --locked
